name: APK derle

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android build-tools 35 / platform 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0" "platforms;android-35"

      - name: Anahtarı hazırla
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "KEYSTORE_BASE64 secret tanimli degil"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/zeka-release.jks"

      - name: APK derle ve imzala
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/zeka-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: bash build.sh

      - name: Sürüm adını oku
        id: ver
        run: |
          v=$(grep -o 'versionName="[^"]*"' android/AndroidManifest.xml | cut -d'"' -f2)
          echo "name=$v" >> "$GITHUB_OUTPUT"
          cp BilmeceDeyimAtasozu.apk "BilmeceDeyimAtasozu-v$v.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: BilmeceDeyimAtasozu-v${{ steps.ver.outputs.name }}
          path: BilmeceDeyimAtasozu-v${{ steps.ver.outputs.name }}.apk

      - name: GitHub Release olustur
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.ver.outputs.name }}"
          gh release view "v$v" >/dev/null 2>&1 \
            && gh release upload "v$v" "BilmeceDeyimAtasozu-v$v.apk" --clobber \
            || gh release create "v$v" "BilmeceDeyimAtasozu-v$v.apk" --title "v$v" --notes "Otomatik derleme"
