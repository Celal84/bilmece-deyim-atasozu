<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Bilmece Deyim Atasözü</title>
<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html{font-size:clamp(14px,4.1vw,21px)}
html,body{margin:0;height:100%;overflow:hidden;font-family:"Trebuchet MS","Segoe UI",Roboto,system-ui,sans-serif;font-weight:700;color:#3b2a1a;background:#8fd3ff}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
#sky{position:fixed;inset:0;background:linear-gradient(#6cc3ff 0%,#bfe8ff 55%,#e9fbff 100%);z-index:0;overflow:hidden}
#sky .cloud{position:absolute;font-size:3.5rem;opacity:.85;animation:drift linear infinite}
#sky .hill{position:absolute;bottom:-6vh;left:-10vw;width:120vw;height:24vh;border-radius:50% 50% 0 0;background:#7ed957}
#sky .hill.h2{left:30vw;width:90vw;height:18vh;background:#5cc13f}
@keyframes drift{from{transform:translateX(-20vw)}to{transform:translateX(120vw)}}
#app{position:fixed;inset:0;z-index:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.wrap{max-width:600px;margin:0 auto;padding:.7rem .9rem 5.5rem;min-height:100%}
.top{display:flex;align-items:center;gap:.6rem;margin-bottom:.6rem}
.chip{background:#fff;border-radius:2rem;padding:.35rem .8rem;box-shadow:0 3px 0 rgba(0,0,0,.12);font-size:1rem;display:flex;align-items:center;gap:.3rem}
.back{width:2.6rem;height:2.6rem;border-radius:50%;background:#fff;font-size:1.3rem;box-shadow:0 3px 0 rgba(0,0,0,.15);flex:none}
.title{font-size:1.4rem;flex:1;text-align:center;text-shadow:0 2px 0 #fff}
.btn{display:block;width:100%;border-radius:1.2rem;padding:.9rem 1rem;font-size:1.15rem;color:#fff;background:#8b5cf6;box-shadow:0 5px 0 rgba(0,0,0,.2);margin:.6rem 0;transition:transform .08s;text-align:center}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.btn.alt{background:#fff;color:#3b2a1a}
.btn.green{background:#22c55e}.btn.orange{background:#f59e0b}.btn.pink{background:#ec4899}.btn.blue{background:#0ea5e9}
.btn[disabled]{filter:grayscale(.8);opacity:.7}
.row{display:flex;gap:.6rem}.row>*{flex:1}
.hero{display:flex;align-items:center;gap:.7rem;background:rgba(255,255,255,.85);border-radius:1.4rem;padding:.6rem .8rem;box-shadow:0 4px 0 rgba(0,0,0,.1)}
.hero .bub{flex:1;font-size:1rem;line-height:1.3}
.hero .bub b{font-size:1.15rem}
.bar{height:.9rem;background:#e5e7eb;border-radius:1rem;overflow:hidden;margin-top:.35rem}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#fbbf24,#f59e0b);border-radius:1rem;transition:width .8s}
.owlbox{position:relative;width:5.6rem;flex:none}
.owlbox.big{width:9rem;margin:0 auto}
.owlbox.sm{width:3.6rem}
.owl{width:100%;display:block;overflow:visible}
.hat{position:absolute;left:50%;top:-.3rem;transform:translateX(-50%) rotate(-6deg);font-size:2.1rem;line-height:1;pointer-events:none}
.owlbox.big .hat{font-size:3.2rem;top:-.6rem}.owlbox.sm .hat{font-size:1.4rem}
.owl .o-body{animation:bob 2.6s ease-in-out infinite;transform-origin:60px 120px}
.owl .lid{animation:blink 4s infinite;transform-origin:center;transform-box:fill-box}
.owl .wl{animation:flapL 2.6s ease-in-out infinite;transform-origin:100% 20%;transform-box:fill-box}
.owl .wr{animation:flapR 2.6s ease-in-out infinite;transform-origin:0 20%;transform-box:fill-box}
.owlbox.cheer{animation:jump .7s}
.owlbox.sad{animation:wob .6s}
@keyframes bob{50%{transform:translateY(-4px) rotate(1.5deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(0)}95%{transform:scaleY(1)}}
@keyframes flapL{50%{transform:rotate(12deg)}}@keyframes flapR{50%{transform:rotate(-12deg)}}
@keyframes jump{30%{transform:translateY(-1.4rem) scale(1.08)}60%{transform:translateY(0)}80%{transform:translateY(-.4rem)}}
@keyframes wob{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.cards{display:grid;gap:.7rem;margin-top:.8rem}
.sec{display:flex;align-items:center;gap:.8rem;border-radius:1.3rem;padding:.8rem .9rem;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.2);text-align:left;width:100%;animation:pop .5s backwards;position:relative;overflow:hidden}
.sec:active{transform:translateY(3px)}
.sec .em{font-size:2.4rem;flex:none;animation:wig 3s infinite}
.sec .nm{font-size:1.2rem;line-height:1.1}
.sec small{display:block;font-size:.8rem;font-weight:600;opacity:.95;margin-top:.15rem}
.sec.lock{background:#9ca3af!important;filter:saturate(.4)}
.sec.lock .em{animation:none}
.sec .stars{position:absolute;right:.7rem;top:.5rem;font-size:.9rem}
@keyframes pop{from{opacity:0;transform:scale(.6) translateY(20px)}}
@keyframes wig{0%,85%,100%{transform:rotate(0)}90%{transform:rotate(-12deg)}95%{transform:rotate(12deg)}}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;gap:.5rem;padding:.5rem;background:rgba(255,255,255,.92);box-shadow:0 -3px 12px rgba(0,0,0,.12)}
.dock button{flex:1;max-width:8rem;background:#fff7e6;border-radius:1rem;padding:.35rem 0;font-size:.75rem;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.dock button span{display:block;font-size:1.5rem}
.gift{position:relative;background:linear-gradient(135deg,#fde68a,#fbbf24);border-radius:1.3rem;padding:.7rem;display:flex;align-items:center;gap:.8rem;width:100%;box-shadow:0 5px 0 rgba(0,0,0,.18);margin-top:.7rem;animation:pulse 1.6s infinite;text-align:left;font-size:1.05rem}
.gift .em{font-size:2.4rem;animation:shake 1s infinite}
@keyframes pulse{50%{transform:scale(1.03)}}
@keyframes shake{0%,70%,100%{transform:rotate(0)}75%{transform:rotate(-14deg)}85%{transform:rotate(14deg)}}
/* quiz */
.qcard{background:#fff;border-radius:1.4rem;padding:1rem;box-shadow:0 5px 0 rgba(0,0,0,.14);margin:.5rem 0 .8rem;animation:pop .35s;font-size:1.2rem;line-height:1.4}
.qcard .tag{font-size:.8rem;color:#fff;border-radius:1rem;padding:.1rem .6rem;display:inline-block;margin-bottom:.4rem}
.qcard .big{font-size:3.4rem;text-align:center;display:block;animation:pop .5s}
.opt{display:block;width:100%;text-align:left;background:#fff;border:3px solid #e5e7eb;border-radius:1.1rem;padding:.8rem .9rem;margin:.5rem 0;font-size:1.1rem;box-shadow:0 4px 0 rgba(0,0,0,.1);animation:pop .4s backwards}
.opt:active{transform:translateY(3px)}
.opt.ok{background:#bbf7d0;border-color:#22c55e;animation:okpop .5s}
.opt.no{background:#fecaca;border-color:#ef4444;animation:shk .45s;opacity:.7}
.opt.off{opacity:.35;pointer-events:none}
@keyframes okpop{40%{transform:scale(1.07)}}
@keyframes shk{20%{transform:translateX(-10px)}50%{transform:translateX(10px)}80%{transform:translateX(-6px)}}
.dots{display:flex;gap:.3rem;flex:1;justify-content:center}
.dots i{width:.8rem;height:.8rem;border-radius:50%;background:#fff;opacity:.6;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.dots i.on{background:#22c55e;opacity:1}.dots i.bad{background:#f87171;opacity:1}.dots i.cur{background:#fbbf24;opacity:1;transform:scale(1.3)}
.fb{border-radius:1.2rem;padding:.8rem;margin:.6rem 0;font-size:1.05rem;line-height:1.4;animation:pop .4s}
.fb.ok{background:#dcfce7}.fb.no{background:#fee2e2}
.float{position:fixed;font-size:1.8rem;color:#f59e0b;pointer-events:none;z-index:60;animation:fl 1.1s forwards;text-shadow:0 2px 0 #fff}
@keyframes fl{to{transform:translateY(-6rem);opacity:0}}
.speak{background:#e0f2fe;border-radius:50%;width:2.6rem;height:2.6rem;font-size:1.3rem;float:right;margin-left:.5rem}
.hintbtn{background:#fef3c7;border-radius:1rem;padding:.5rem 1rem;box-shadow:0 3px 0 rgba(0,0,0,.12);font-size:1rem}
/* learn */
.lcard{background:#fff;border-radius:1.6rem;padding:1.2rem;box-shadow:0 6px 0 rgba(0,0,0,.14);text-align:center;min-height:15rem;display:flex;flex-direction:column;justify-content:center;gap:.6rem;animation:pop .35s}
.lcard .em{font-size:3.6rem}
.lcard h2{margin:0;font-size:1.5rem;line-height:1.25}
.lcard p{margin:0;font-size:1.1rem;line-height:1.45;font-weight:600}
.lcard .ex{background:#f0f9ff;border-radius:1rem;padding:.6rem;font-style:italic}
.lcard .ex b{color:#0284c7}
.speeds{display:flex;gap:.4rem;justify-content:center}
.speeds button{background:#f3e8ff;border-radius:1rem;padding:.5rem .8rem;box-shadow:0 3px 0 rgba(0,0,0,.12)}
/* result */
.stars3{font-size:3.2rem;text-align:center;letter-spacing:.3rem}
.stars3 span{display:inline-block;animation:starin .6s backwards}
@keyframes starin{from{transform:scale(0) rotate(-180deg);opacity:0}}
.big{font-size:3.4rem;text-align:center}
/* modal */
.modal{position:fixed;inset:0;background:rgba(30,20,60,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:1rem;animation:fade .25s}
.mbox{background:#fff;border-radius:1.8rem;padding:1.3rem;max-width:22rem;width:100%;text-align:center;animation:pop .45s;box-shadow:0 8px 0 rgba(0,0,0,.2)}
.mbox .em{font-size:4.4rem;animation:wig 1.6s infinite}
.mbox h2{margin:.2rem 0;font-size:1.5rem}
.mbox p{margin:.3rem 0 .6rem;font-size:1.05rem;line-height:1.4;font-weight:600}
@keyframes fade{from{opacity:0}}
.chest{font-size:6rem;animation:shake .6s infinite}
.chest.open{animation:okpop .7s}
#fx{position:fixed;inset:0;z-index:70;pointer-events:none}
/* album */
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:.5rem}
.stk{aspect-ratio:1;background:#fff;border-radius:1rem;display:flex;align-items:center;justify-content:center;font-size:2rem;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.stk.no{background:#e5e7eb;filter:grayscale(1);opacity:.55;font-size:1.4rem}
.stk.new{animation:okpop 1s infinite}
.hats{display:grid;grid-template-columns:repeat(2,1fr);gap:.6rem}
.hatc{background:#fff;border-radius:1.2rem;padding:.7rem;box-shadow:0 4px 0 rgba(0,0,0,.12);font-size:.95rem;text-align:center}
.hatc .em{font-size:2.4rem;display:block}
.hatc.sel{outline:4px solid #22c55e}
.hatc.no{opacity:.5;filter:grayscale(1)}
.tog{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:1.1rem;padding:.8rem 1rem;margin:.5rem 0;width:100%;font-size:1.1rem;box-shadow:0 3px 0 rgba(0,0,0,.1)}
.tog b{background:#e5e7eb;border-radius:1rem;padding:.2rem .8rem}.tog b.on{background:#22c55e;color:#fff}
input.name{width:100%;font:inherit;font-size:1.3rem;border:3px solid #c4b5fd;border-radius:1rem;padding:.7rem;text-align:center;user-select:text;-webkit-user-select:text}
/* games */
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:.55rem}
.mc{aspect-ratio:1/1.05;perspective:600px;background:none;padding:0}
.mc .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.mc.f .in,.mc.m .in{transform:rotateY(180deg)}
.mc .fa,.mc .ba{position:absolute;inset:0;border-radius:1rem;display:flex;align-items:center;justify-content:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.mc .ba{background:linear-gradient(135deg,#a78bfa,#7c3aed);font-size:2rem;color:#fff}
.mc .fa{background:#fff;transform:rotateY(180deg);font-size:2.4rem;text-align:center;line-height:1.1;padding:.2rem}
.mc .fa.w{font-size:1.05rem}
.mc.m .fa{background:#bbf7d0;animation:okpop .6s}
.balls{position:relative;height:60vh;margin-top:.4rem}
.ball{position:absolute;width:6.2rem;height:7.6rem;border-radius:50% 50% 48% 48%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:1rem;text-align:center;padding:.4rem;box-shadow:inset -8px -10px 0 rgba(0,0,0,.14),0 4px 8px rgba(0,0,0,.15);animation:float 3.4s ease-in-out infinite}
.ball::after{content:"";position:absolute;bottom:-1.1rem;left:50%;width:2px;height:1.2rem;background:#6b7280}
.ball.gone{animation:popb .35s forwards;pointer-events:none}
.ball.bad{animation:shk .45s;opacity:.35;pointer-events:none}
@keyframes float{50%{transform:translateY(-1.4rem) rotate(3deg)}}
@keyframes popb{50%{transform:scale(1.4)}to{transform:scale(0);opacity:0}}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.mt{background:#fff;border:3px solid #e5e7eb;border-radius:1rem;padding:.6rem;font-size:.95rem;box-shadow:0 3px 0 rgba(0,0,0,.1);text-align:center;min-height:4rem;margin-bottom:.55rem;width:100%}
.mt.sel{border-color:#f59e0b;background:#fef3c7}
.mt.done{background:#bbf7d0;border-color:#22c55e;pointer-events:none}
.mt.no{animation:shk .45s;border-color:#ef4444}
.slots,.chips{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;margin:.7rem 0}
.slot{min-width:3.2rem;min-height:2.6rem;border:3px dashed #a78bfa;border-radius:.9rem;padding:.35rem .6rem;background:#faf5ff;font-size:1.05rem}
.slot.fill{background:#e9d5ff;border-style:solid}.slot.ok{background:#bbf7d0;border-color:#22c55e}.slot.bad{background:#fecaca;border-color:#ef4444;animation:shk .45s}
.chip2{background:#fff;border-radius:.9rem;padding:.45rem .8rem;box-shadow:0 3px 0 rgba(0,0,0,.15);font-size:1.05rem}
.chip2.used{opacity:.25;pointer-events:none}
</style></head>

const A = {
  ctx: null, step: 0, next: 0, mood: 'menu',
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
      const c = this.ctx = new C();
      this.mg = c.createGain(); this.mg.gain.value = .9; this.mg.connect(c.destination);
      this.mus = c.createGain(); this.mus.gain.value = .5; this.mus.connect(this.mg);
      this.sfx = c.createGain(); this.sfx.gain.value = .9; this.sfx.connect(this.mg);
      this.next = c.currentTime + .2;
      setInterval(() => this.sched(), 70);
    } catch (e) { }
  },
  tone(f, t, d, type, v, dest, f2) {
    const c = this.ctx; if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t + d + .05);
  },
  bpm() { return this.mood === 'play' ? 118 : 96; },
  sched() {
    const c = this.ctx; if (!c) return;
    if (!S.set.music || c.state !== 'running') { this.next = c.currentTime + .15; return; }
    while (this.next < c.currentTime + .25) { this.play(this.step, this.next); this.next += 30 / this.bpm(); this.step++; }
  },
  play(step, t) {
    const CH = [[261.63, 329.63, 392], [220, 261.63, 329.63], [174.61, 220, 261.63], [196, 246.94, 293.66]];
    const BS = [130.81, 110, 87.31, 98];
    const SC = [523.25, 587.33, 659.25, 783.99, 880, 1046.5];
    const PAT = [
      [2, -1, 3, 2, 0, -1, 1, -1, 2, -1, 4, 3, 2, -1, -1, -1],
      [4, -1, 3, 2, 3, -1, 1, -1, 0, 1, 2, -1, 3, -1, 2, -1],
      [0, 2, 4, 2, 3, -1, 2, -1, 1, 3, 5, 3, 4, -1, -1, -1]
    ];
    const bar = Math.floor(step / 8) % 4, pos = step % 8;
    if (step % 32 === 0) this.pat = PAT[rnd(3)];
    const play = this.mood === 'play';
    if (pos === 0 || pos === 4) this.tone(BS[bar], t, .5, 'triangle', .3, this.mus);
    if (play ? true : pos % 2 === 0) this.tone(CH[bar][pos % 3] * 2, t, .25, 'sine', .07, this.mus);
    const mi = (this.pat || PAT[0])[(step % 16)];
    if (mi >= 0 && (play || step % 16 < 8 || Math.random() < .5)) this.tone(SC[mi], t, .32, 'triangle', .13, this.mus);
    if (play && pos % 2 === 1) this.tone(8000, t, .03, 'square', .01, this.mus);
  },
  s(kind) {
    if (!this.ctx || !S.set.sfx) return; const c = this.ctx, t = c.currentTime, d = this.sfx;
    const seq = (a, step, ty, v, dur) => a.forEach((f, i) => this.tone(f, t + i * step, dur || .22, ty || 'triangle', v || .22, d));
    if (kind === 'ok') seq([523, 659, 784, 1046], .07, 'triangle', .25);
    else if (kind === 'no') { this.tone(330, t, .25, 'sine', .22, d, 220); }
    else if (kind === 'click') this.tone(760, t, .07, 'sine', .15, d);
    else if (kind === 'coin') seq([1318, 1760], .08, 'square', .08, .25);
    else if (kind === 'win') seq([523, 659, 784, 1046, 784, 1046, 1318], .11, 'triangle', .26, .3);
    else if (kind === 'pop') this.tone(900, t, .12, 'sine', .25, d, 120);
    else if (kind === 'chest') this.tone(200, t, .6, 'sawtooth', .08, d, 900);
    else if (kind === 'flip') this.tone(500, t, .08, 'sine', .12, d, 700);
    else if (kind === 'lvl') seq([392, 523, 659, 784, 1046, 1318, 1568], .09, 'triangle', .26, .35);
  }
};

let fxRun = false;
function confetti(n = 110) {
  const cv = $('#fx'); const dpr = 1; cv.width = innerWidth; cv.height = innerHeight; const g = cv.getContext('2d');
  const cols = ['#f43f5e', '#f59e0b', '#22c55e', '#0ea5e9', '#8b5cf6', '#ec4899', '#facc15'];
  const P = []; for (let i = 0; i < n; i++) P.push({ x: innerWidth / 2 + (Math.random() - .5) * 120, y: innerHeight * .45, vx: (Math.random() - .5) * 16, vy: -Math.random() * 16 - 4, w: 6 + Math.random() * 8, h: 4 + Math.random() * 7, c: cols[rnd(cols.length)], r: Math.random() * 6, vr: (Math.random() - .5) * .4 });
  const t0 = performance.now(); fxRun = true;
  (function f(t) {
    g.clearRect(0, 0, cv.width, cv.height); let alive = 0;
    P.forEach(p => { p.vy += .45; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.vx *= .99; if (p.y < innerHeight + 20) alive++; g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.fillStyle = p.c; g.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); g.restore(); });
    if (alive && t - t0 < 3500) requestAnimationFrame(f); else { g.clearRect(0, 0, cv.width, cv.height); fxRun = false; }
  })(t0);
}

}

  learn(el) { const id = el.dataset.a; go('learn', { id, list: pickItems(id, 10), i: 0 }); },
  lnext() { cur.p.i++; cur.p.rev = false; render(); },
  lprev() { cur.p.i--; cur.p.rev = false; render(); },
  reveal() { cur.p.rev = true; A.s('ok'); render(); },
  say(el) { forceSpeak(cur.p.list[cur.p.i].t, +el.dataset.r); },
  say2() { forceSpeak(cur.p.say, .9); },
  pick(el) { qPick(+el.dataset.i, el); },
  hint: qHint,
  spt(el) { const q = QZ.qs[QZ.i], i = +el.dataset.i; if (q.done || q.put.includes(i) || q.put.length >= q.tiles.length) return; q.put.push(i); spDraw(); },
  sps(el) { const q = QZ.qs[QZ.i], k = +el.dataset.i; if (q.done || k >= q.put.length) return; q.put.splice(k, 1); spDraw(); },
  spdel() { const q = QZ.qs[QZ.i]; if (q.done) return; q.put.pop(); spDraw(); },
  spchk(el) { spCheck(el); },
  qspeak() { forceSpeak(QZ.qs[QZ.i].speak, .9); },
  qsay() { forceSpeak(QZ.qs[QZ.i].say, .8); },
  qnext() { QZ.i++; if (QZ.i >= QZ.qs.length) endQuiz(); else quizShow(); },
  exitq: exitQuiz,
  quitq() { closeModal(true); QZ = null; NAV.pop(); render(); },
  chest(el) { chestFlow(el.dataset.g === '1'); el.remove(); },
  chestopen(el) { closeModal(true); chestOpen(el.dataset.d === '1'); },
  notebook() { go('notebook'); },
  nspeak(el) { const k = el.dataset.k; const it = Object.values(ITEMS).flat().find(x => x.id === k); if (it) forceSpeak(it.f, .9); },
  album() { go('album'); }, wardrobe() { go('wardrobe'); }, settings() { go('settings'); },
  stk(el) { A.s('pop'); el.classList.add('new'); speak('Harika bir çıkartma!'); setTimeout(() => el.classList.remove('new'), 1200); },
  hat(el) { S.hat = el.dataset.a; save(); A.s('ok'); render(); },
  hatlock(el) { A.s('no'); showModal({ e: '🔒', title: 'Kilitli', text: el.dataset.a === 'usta' ? `Bu madalya <b>Usta Kulesi</b>'nde 3 yıldız toplayınca açılır!` : `Bu aksesuar <b>Seviye ${el.dataset.a}</b>'de açılır!`, btns: [{ t: 'Tamam', a: 'close', c: 'green' }] }); },
  tog(el) { const k = el.dataset.a; S.set[k] = !S.set[k]; save(); render(); },
  savename() { S.name = ($('#nm').value || '').trim() || 'Kaşif'; save(); A.s('ok'); showModal({ e: '✅', title: 'Kaydedildi!', text: 'Merhaba ' + esc(S.name) + '!' }); },
  reset() { showModal({ e: '⚠️', title: 'Emin misin?', text: 'Tüm puanlar, çıkartmalar ve ilerleme silinecek!', btns: [{ t: 'Vazgeç', a: 'close', c: 'green' }, { t: 'Evet, sıfırla', a: 'reset2', c: 'alt' }] }); },
  reset2() { closeModal(true); S = defState(); save(); NAV = []; go('intro'); },
  game(el) { if (cur.name === 'result') NAV.pop(); gameStart(el.dataset.a); },
  mflip(el) { mFlip(+el.dataset.i); },
  gspeak() { forceSpeak(G.items[G.r].q, .9); },
  bpick(el) { bPick(+el.dataset.i, el); },
  mt(el) { mtPick(el); },
  schip(el) { sChip(+el.dataset.i); },
  sslot(el) { sSlot(+el.dataset.i); },
  snext() { G.r++; if (G.r >= 3) { const st = (G.totalFails || 0) === 0 ? 3 : G.totalFails <= 3 ? 2 : 1; gameEnd('Atasözleri Tamam!', 10 + st * 5, st, 'srt', G.gain); } else render(); }
};
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a) return;
  if (ACT[a.dataset.act]) { if (!['pick', 'bpick', 'mflip', 'schip', 'sslot', 'mt', 'spchk'].includes(a.dataset.act)) A.s('click'); ACT[a.dataset.act](a); }
});

// ---------- Başlat ----------
(function init() {
  const sky = $('#sky');
  for (let i = 0; i < 5; i++) { const c = document.createElement('div'); c.className = 'cloud'; c.textContent = '☁️'; c.style.top = (4 + i * 11) + 'vh'; c.style.animationDuration = (50 + i * 15) + 's'; c.style.animationDelay = (-i * 17) + 's'; c.style.fontSize = (2.4 + (i % 3)) + 'rem'; sky.appendChild(c); }
  sky.insertAdjacentHTML('beforeend', '<div class="hill"></div><div class="hill h2"></div>');
  if (!S.name) NAV.push({ name: 'intro' }); else NAV.push({ name: 'home' });
  render();
})();
</script>
</body></html>
